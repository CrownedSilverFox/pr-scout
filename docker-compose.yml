services:
  scout:
    build: .
    restart: unless-stopped
    environment:
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY}
      APP_PASSWORD: ${APP_PASSWORD}
      # Recommended: a GitHub token without scopes (higher rate limit, CI status of finalists)
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      # Local model for PR descriptions (Ollama on the Docker host)
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - scout_data:/data
    ports:
      - "127.0.0.1:${SCOUT_PORT:-8000}:8000"

volumes:
  scout_data:
